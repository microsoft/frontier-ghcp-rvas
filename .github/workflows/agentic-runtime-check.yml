name: Agentic Runtime Check

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/aw/actions-lock.json"
      - ".github/dependabot.yml"
      - "scripts/check-agentic-runtime*.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/aw/actions-lock.json"
      - ".github/dependabot.yml"
      - "scripts/check-agentic-runtime*.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test the runtime check
        run: node --test scripts/check-agentic-runtime.test.mjs
      - name: Check generated runtime pins
        run: node scripts/check-agentic-runtime.mjs
