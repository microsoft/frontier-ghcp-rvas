openapi: 3.0.3
info:
  title: Order Management
  version: "2026.07"
servers:
  - url: http://localhost:4102
paths:
  /orders/v2:
    get:
      operationId: orders_list_v2
      security:
        - apiKey: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Orders
          headers:
            X-Trace-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  page:
                    type: integer
                  pages:
                    type: integer
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Order:
      type: object
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        traceId:
          type: string
